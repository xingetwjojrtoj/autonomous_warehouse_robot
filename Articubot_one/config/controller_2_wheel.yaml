controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: false

    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster
diff_cont:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    wheels_per_side: 1
    wheel_separation: 0.44
    wheel_radius: 0.165
    

    position_feedback: false

    cmd_vel_timeout: 0.5

    publish_rate: 50.0

    open_loop: false

    enable_odom_tf: false  #it was true initally but want to be published by ekf2 only

    odom_frame_id: odom
    base_frame_id: base_link

    use_stamped_vel: false