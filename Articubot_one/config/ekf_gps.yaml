### LOCAL EKF: Generates continuous odom -> base_link transform
ekf_filter_node_local:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0   #ealier 20
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom            # Local frame

    # Connect to your diff drive controller wheel odometry topic
    odom0: /wheel/odom
    odom0_config: [false,  false,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    # odom0_config: [false,  false,  false,
    #                false, false, false,
    #                false,  false, false,
    #                false, false, false,
    #                false, false, false]
    odom0_differential: false
    odom0_relative: true

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, true,            
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false   # EKF treat the starting position of the wheel odometry as(0,0)

### GLOBAL EKF: Generates map -> odom transform fusing GPS
ekf_filter_node_global:
  ros__parameters:
    use_sim_time: false
    frequency: 10.0
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map             # Global frame

    # odom0: /odometry/gps         # Output from navsat_transform
    # odom0_config: [true,  true,  false,
    #                false, false, false,
    #                false, false, false,
    #                false, false, false,
    #                false, false, false]
    # odom0_differential: false
    # odom0_relative: false


    odom0: /wheel/odom         # Output from navsat_transform
    odom0_config: [false,  false,  false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: true

    
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, true,            
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false

### NAVSAT TRANSFORM: Converts raw GPS into Odometry messages
navsat_transform:
  ros__parameters:
    use_sim_time: false
    frequency: 10.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 3.141592653589793
    zero_altitude: true
    broadcast_utm_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: true
    datum: [22.686297, 75.859927, 0.0]
